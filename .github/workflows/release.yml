name: Release & Publish NuGet

on:
  push:
    tags:
      - "v*.*.*"   # e.g. v1.0.0, v0.1.0-beta

permissions:
  contents: write   # needed to create a GitHub Release
  id-token: write   # needed for NuGet Trusted Publishing (GitHub OIDC)

jobs:
  release:
    name: Pack & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Strip leading 'v' from tag to get the version number (e.g. v1.2.3 → 1.2.3)
      - name: Parse version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Pack
        run: >
          dotnet pack src/CloudflaredKit/CloudflaredKit.csproj
          --no-build -c Release
          -p:PackageVersion=${{ steps.version.outputs.VERSION }}
          -o ./nupkgs

      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name (not email)

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push ./nupkgs/*.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          files: ./nupkgs/*.nupkg
