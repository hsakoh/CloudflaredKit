name: Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: ./TestResults/*.trx
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.os }})
    # E2E tests download cloudflared and open a real TryCloudflare tunnel.
    # Run only on push (not PRs) to avoid unnecessary external traffic on every review cycle.
    # Only TryCloudflare tests run here — each OS runner gets its own independent tunnel URL.
    if: github.event_name == 'push'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            non_blocking: false
          - os: macos-latest
            non_blocking: true
          - os: windows-latest
            non_blocking: false

    runs-on: ${{ matrix.os }}
    # Keep macOS TryCloudflare coverage visible, but do not fail the whole workflow on its flaky DNS behavior.
    continue-on-error: ${{ matrix.non_blocking }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: E2E Test (TryCloudflare)
        env:
          CLOUDFLARED_E2E: "1"
          # CLOUDFLARE_TUNNEL_TOKEN is intentionally NOT set here.
          # Permanent tunnel tests must not run in a matrix because all runners would share
          # the same tunnel, causing Cloudflare to load-balance traffic non-deterministically.
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=e2e-results.trx" --results-directory ./TestResults

      - name: Upload E2E test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results-${{ matrix.os }}
          path: ./TestResults/*.trx
          retention-days: 7

  check-permanent-tunnel-secret:
    name: Check permanent tunnel secret
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      has-token: ${{ steps.check.outputs.has-token }}

    steps:
      - name: Check token presence
        id: check
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-token=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-permanent:
    name: E2E Permanent Tunnel
    # Permanent tunnel tests run on a single runner to avoid multiple runners competing
    # for the same tunnel token and causing non-deterministic load balancing.
    if: github.event_name == 'push' && needs.check-permanent-tunnel-secret.outputs.has-token == 'true'
    needs: [ test, check-permanent-tunnel-secret ]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: E2E Test (Permanent Tunnel)
        env:
          CLOUDFLARED_E2E: "1"
          CLOUDFLARED_PERMANENT_E2E: "1"
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CLOUDFLARE_TUNNEL_URL: ${{ secrets.CLOUDFLARE_TUNNEL_URL }}
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=e2e-permanent-results.trx" --results-directory ./TestResults

      - name: Upload E2E permanent tunnel test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-permanent-results
          path: ./TestResults/*.trx
          retention-days: 7
